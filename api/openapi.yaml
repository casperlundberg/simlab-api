openapi: 3.1.0
info:
  title: Simlab
  version: "1.0.0"
  description: |
    The backend of Simlab: a mining-workload simulation and emulation
    application.

    Simlab drives **runs**. A run replays a seismic-processing workload and
    asks the real autoscaler what to do about it, cycle by cycle, storing every
    observation and decision.

    Two modes, differing only in which autoscaler target the run drives:

    - **simulation** — a target on the autoscaler's `simulation` platform.
      Decisions are computed by the real decision engine and reported back;
      nothing is provisioned; time is compressed. Simlab creates the target for
      the run and removes it afterwards.
    - **live** — a target on real infrastructure. Simlab observes and records;
      it never drives, because a second controller issuing decisions would be
      two schedulers fighting over one fleet.

    This service is also the only thing that talks to the autoscaler. The
    `/api/platforms`, `/api/targets` and `/api/targets/{id}/settings` endpoints
    stand in front of it, so a browser needs no credential: the autoscaler's
    token unlocks every platform credential it holds, and a token that reaches
    a browser has been disclosed.

    Durations are seconds throughout.

servers:
  - url: /

tags:
  - name: health
  - name: mines
    description: The sites whose workloads are studied.
  - name: scenarios
    description: Workloads to replay. A scenario's seed is what makes two runs comparable.
  - name: runs
    description: Replaying a workload, and reading what happened.
  - name: autoscaler
    description: The live autoscaler, reached through this service.

paths:
  /healthz:
    get:
      security: []   # a kubelet cannot carry a credential
      tags: [health]
      summary: Liveness probe
      responses:
        "200": { description: Alive., content: { application/json: { schema: { type: object } } } }

  /readyz:
    get:
      security: []   # a kubelet cannot carry a credential
      tags: [health]
      summary: Readiness probe
      description: Fails while the database is unreachable, and reports how many runs are in flight.
      responses:
        "200": { description: Ready., content: { application/json: { schema: { type: object } } } }
        "503": { description: The database is unreachable., content: { application/json: { schema: { type: object } } } }

  /api/mines:
    get:
      tags: [mines]
      summary: List mines
      responses:
        "200":
          description: Every mine, by name.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mines: { type: array, items: { $ref: "#/components/schemas/Mine" } }
    post:
      tags: [mines]
      summary: Create or replace a mine
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Mine" } } }
      responses:
        "200": { description: Saved., content: { application/json: { schema: { $ref: "#/components/schemas/Mine" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/mines/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      tags: [mines]
      summary: Fetch a mine
      responses:
        "200": { description: The mine., content: { application/json: { schema: { $ref: "#/components/schemas/Mine" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [mines]
      summary: Replace a mine
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Mine" } } }
      responses:
        "200": { description: Saved., content: { application/json: { schema: { $ref: "#/components/schemas/Mine" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
    delete:
      tags: [mines]
      summary: Delete a mine and its scenarios
      responses:
        "204": { description: Deleted. }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/scenarios:
    get:
      tags: [scenarios]
      summary: List scenarios
      parameters:
        - name: mine_id
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Scenarios.
          content:
            application/json:
              schema:
                type: object
                properties:
                  scenarios: { type: array, items: { $ref: "#/components/schemas/Scenario" } }
    post:
      tags: [scenarios]
      summary: Create or replace a scenario
      description: |
        A scenario with no `seed` is given one, because a scenario that cannot
        be replayed identically makes every comparison drawn from it
        meaningless.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Scenario" } } }
      responses:
        "200": { description: Saved., content: { application/json: { schema: { $ref: "#/components/schemas/Scenario" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/scenarios/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      tags: [scenarios]
      summary: Fetch a scenario
      responses:
        "200": { description: The scenario., content: { application/json: { schema: { $ref: "#/components/schemas/Scenario" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [scenarios]
      summary: Replace a scenario
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Scenario" } } }
      responses:
        "200": { description: Saved., content: { application/json: { schema: { $ref: "#/components/schemas/Scenario" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
    delete:
      tags: [scenarios]
      summary: Delete a scenario
      description: Runs that used it keep their results; their scenario reference is cleared.
      responses:
        "204": { description: Deleted. }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/runs:
    get:
      tags: [runs]
      summary: List runs, newest first
      description: |
        Each entry carries `active`, which the database alone cannot answer: a
        process that was killed leaves a run stuck at `running` in the table.
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, running, completed, failed, cancelled] }
        - name: limit
          in: query
          schema: { type: integer, default: 100, maximum: 500 }
      responses:
        "200":
          description: Runs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  runs:
                    type: array
                    items:
                      type: object
                      properties:
                        run: { $ref: "#/components/schemas/Run" }
                        active: { type: boolean }
    post:
      tags: [runs]
      summary: Start a run
      description: |
        Returns as soon as the run is under way; it executes in the background
        and survives the tab that started it being closed.

        A simulation run gets an autoscaler target of its own, created with the
        run and removed when it ends — including when it fails. A shared target
        would start each run holding the previous run's executors.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RunRequest" } } }
      responses:
        "202": { description: Started., content: { application/json: { schema: { $ref: "#/components/schemas/Run" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: This run is already in flight., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/runs/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      tags: [runs]
      summary: Fetch a run, with its metrics and the settings it ran under
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema:
                type: object
                properties:
                  run: { $ref: "#/components/schemas/Run" }
                  active: { type: boolean }
                  metrics: { $ref: "#/components/schemas/Metrics" }
                  settings: { type: object }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [runs]
      summary: Delete a run and everything recorded for it
      responses:
        "204": { description: Deleted. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: The run is still in flight; cancel it first., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/runs/{id}/cancel:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    post:
      tags: [runs]
      summary: Stop a run
      description: Whatever it recorded before stopping stands, and it is marked cancelled rather than failed.
      responses:
        "202": { description: Stopping., content: { application/json: { schema: { type: object } } } }
        "409": { description: The run is not in flight., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/runs/{id}/cycles:
    parameters:
      - $ref: "#/components/parameters/ID"
      - name: from
        in: query
        description: Return cycles after this sequence number, so a client follows a run without refetching its whole timeline.
        schema: { type: integer, default: 0 }
      - name: limit
        in: query
        schema: { type: integer, default: 5000, maximum: 20000 }
    get:
      tags: [runs]
      summary: A run's timeline
      responses:
        "200":
          description: Cycles, in order, with the sequence to resume from.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cycles: { type: array, items: { $ref: "#/components/schemas/Cycle" } }
                  next: { type: integer }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/runs/{id}/metrics:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      tags: [runs]
      summary: What a run amounted to
      responses:
        "200": { description: Metrics., content: { application/json: { schema: { $ref: "#/components/schemas/Metrics" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/runs/{id}/layout:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      tags: [runs]
      summary: The sensor array a run's virtual mine was replayed against
      description: |
        Recorded when the run started rather than read from the mine, which
        can be edited afterwards: this is what the autoscaler was actually
        deciding against.
      responses:
        "200":
          description: The layout.
          content:
            application/json:
              schema:
                type: object
                properties:
                  layout: { $ref: "#/components/schemas/Layout" }
        "404":
          description: |
            No such run, or a run with no virtual mine — a live run, or one
            recorded before mines were modelled. The message says which.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api/runs/{id}/seismicity:
    parameters:
      - $ref: "#/components/parameters/ID"
      - name: from
        in: query
        description: Return events after this sequence number.
        schema: { type: integer, default: 0 }
      - name: limit
        in: query
        schema: { type: integer, default: 5000, maximum: 20000 }
    get:
      tags: [runs]
      summary: A run's seismic events, and when the mine could locate each one
      description: |
        Every detected event is recorded as the run starts, unlocated, and
        updated as its picks are processed. While a run is in flight, re-read
        this rather than assuming an earlier read is still current.
      responses:
        "200":
          description: Events, in order, with the sequence to resume from.
          content:
            application/json:
              schema:
                type: object
                properties:
                  events: { type: array, items: { $ref: "#/components/schemas/SeismicEvent" } }
                  next: { type: integer }

  /api/runs/{id}/entities:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      tags: [runs]
      summary: The people and vehicles underground during a run, and where they went
      description: |
        Recorded as the run starts. Not paged: a day of a whole workforce's
        movement is a few megabytes, and a view needs all of it to move anyone.
      responses:
        "200":
          description: Entities, by id.
          content:
            application/json:
              schema:
                type: object
                properties:
                  entities: { type: array, items: { $ref: "#/components/schemas/Entity" } }

  /api/runs/{id}/events:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      tags: [runs]
      summary: Watch one run as it happens
      description: |
        Server-sent events. Event types are `status`, `cycle` and `metrics`.

        A watcher that falls behind loses events rather than slowing the run
        down, so a client that reconnects should re-read the run's cycles from
        `/cycles?from=` rather than assuming the stream was complete.
      responses:
        "200":
          description: An event stream.
          content:
            text/event-stream:
              schema: { type: string }

  /api/events:
    get:
      tags: [runs]
      summary: Watch every run
      responses:
        "200":
          description: An event stream.
          content:
            text/event-stream:
              schema: { type: string }

  /api/platforms:
    get:
      tags: [autoscaler]
      summary: What the autoscaler can scale
      description: Passed through unchanged, so a client can render a registration form for a platform it was never written for.
      responses:
        "200": { description: Platforms., content: { application/json: { schema: { type: object } } } }

  /api/targets:
    get:
      tags: [autoscaler]
      summary: List the autoscaler's targets
      responses:
        "200": { description: Targets., content: { application/json: { schema: { type: object } } } }
    post:
      tags: [autoscaler]
      summary: Register a target on real infrastructure
      description: |
        Credentials go in and are never returned; the autoscaler redacts them.
        They pass through this service and are not stored here.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object } } }
      responses:
        "201": { description: Registered., content: { application/json: { schema: { type: object } } } }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/targets/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      tags: [autoscaler]
      summary: Fetch a target
      responses:
        "200": { description: The target., content: { application/json: { schema: { type: object } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [autoscaler]
      summary: Remove a target
      responses:
        "204": { description: Removed. }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/targets/{id}/settings:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      tags: [autoscaler]
      summary: A target's live settings
      responses:
        "200": { description: Settings., content: { application/json: { schema: { type: object } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [autoscaler]
      summary: Change a live autoscaler's policy
      description: |
        This is what makes the settings editor real rather than decorative: the
        change reaches the running controller and is in force on its next
        decision cycle.

        Pass `expected_version` to make the write a compare-and-swap.
      parameters:
        - name: expected_version
          in: query
          schema: { type: integer, format: int64 }
        - name: X-Simlab-Actor
          in: header
          description: Carried through to the autoscaler's change log, so the change is attributable to a person rather than to "simlab".
          schema: { type: string }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object } } }
      responses:
        "200": { description: Applied., content: { application/json: { schema: { type: object } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: The settings changed since the version being edited., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/targets/{id}/status:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      tags: [autoscaler]
      summary: A target's last decision
      responses:
        "200": { description: Status., content: { application/json: { schema: { type: object } } } }
        "404": { $ref: "#/components/responses/NotFound" }

# Applies to every operation below. The probes are exempt, and say so
# individually with `security: []`.
security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Required on every endpoint except the probes.

        This service is the one that is published — simlab-web's nginx proxies
        `/api` straight to it — and it holds the autoscaler's own token and
        proxies to it. An unauthenticated call here therefore reaches an
        authenticated autoscaler, and through it whatever infrastructure a
        registered target points at.

        Set `SIMLAB_API_TOKEN` to require it. Left empty the API is open, which
        only suits a development install that nothing can reach.
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { type: string }

  responses:
    BadRequest:
      description: The request cannot be carried out, with the reason given.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: No such thing.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
      required: [error]

    Mine:
      type: object
      properties:
        id: { type: string, example: storhall }
        name: { type: string }
        sensors:
          type: integer
          minimum: 1
          description: |
            How many seismic sensors the site runs. It sets the scale of
            everything downstream: more sensors means more picks per event, and
            more picks means more jobs.
        background_rate_per_hour:
          type: number
          description: Events per hour when nothing unusual is happening.
        layout:
          $ref: "#/components/schemas/Layout"
          description: |
            Where the sensors are. Optional: a mine that states none gets one
            derived from its sensor count and id, the same in every scenario.
            When stated it must place exactly `sensors` sensors, each inside
            its extent.
        description: { type: string }
        created_at: { type: string, format: date-time }
      required: [id, name, sensors]

    Point:
      type: object
      description: |
        A position in metres. `z` is elevation against the surface datum, so
        underground is negative and the -500 level is at z = -500.
      properties:
        x: { type: number }
        y: { type: number }
        z: { type: number }
      required: [x, y, z]

    Layout:
      type: object
      properties:
        extent:
          type: object
          description: The volume of rock, as an axis-aligned box. Events happen and are located inside it.
          properties:
            min: { $ref: "#/components/schemas/Point" }
            max: { $ref: "#/components/schemas/Point" }
        sensors:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              at: { $ref: "#/components/schemas/Point" }
        tunnels:
          type: array
          description: |
            The excavations. Optional on a stated layout; a derived one always
            has them, with its sensors installed in them. Tunnels join where
            they share a vertex exactly.
          items: { $ref: "#/components/schemas/Tunnel" }

    Tunnel:
      type: object
      properties:
        id: { type: string, example: L600-crosscut-2 }
        kind: { type: string, description: "shaft, ramp, drive, crosscut, ore-drive or access" }
        path: { type: array, minItems: 2, items: { $ref: "#/components/schemas/Point" } }

    Entity:
      type: object
      properties:
        id: { type: string, example: person-03 }
        kind: { type: string, enum: [person, crewed-vehicle, autonomous-vehicle] }
        track:
          type: array
          description: |
            Waypoints as [seconds, x, y, z], in time order. Between two, the
            entity moves in a straight line at constant speed; two in a row at
            one position are a stop. Outside the track it holds its first or
            last position.
          items: { type: array, items: { type: number }, minItems: 4, maxItems: 4 }

    Exposure:
      type: object
      description: One person or vehicle within reach of an event.
      properties:
        entity: { type: string }
        level: { type: string, enum: [moderate, high, very-high] }
        ppv_mps: { type: number, description: Predicted peak particle velocity where they were. }
        distance_m: { type: number }

    Location:
      type: object
      description: A location the mine solved from picks.
      properties:
        at: { $ref: "#/components/schemas/Point" }
        rms_residual_seconds:
          type: number
          description: The arrival-time error the solution could not explain — how far to trust it.
        picks: { type: integer, description: How many detections it was solved from. }
        magnitude:
          type: [number, "null"]
          description: The mine's estimate (Nuttli mN), the mean of the same picks' amplitude readings.
        zones:
          type: object
          additionalProperties: { type: number }
          description: |
            For each level of ground motion the event can reach (moderate, high,
            very-high), how far from this location it extends, in metres,
            widened by the 50 m the mine allows a location to be out. From the
            Canadian Rockburst Support Handbook's design scaling law,
            ppv = C*·√(10^(mN+1))/R with C* = 0.25 m²/s, held at its value at
            the near-field limit.
        exposed:
          type: array
          items: { $ref: "#/components/schemas/Exposure" }
          description: Who the mine judged exposed from this location, where they were when it had it.

    SeismicEvent:
      type: object
      properties:
        run_id: { type: string }
        sequence: { type: integer }
        origin_seconds: { type: number, description: When it happened, from the start of the scenario. }
        burst:
          type: [integer, "null"]
          description: The index of the scenario burst it belongs to; null for background activity.
        magnitude:
          type: [number, "null"]
          description: How large it really was (Nuttli mN). Ground truth, like `truth`.
        exposed:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/Exposure" }
          description: Who it really exposed, where they were when it happened. The simulator's answer.
        truth:
          $ref: "#/components/schemas/Point"
          description: |
            Where it really happened. Known to the simulator and to nothing
            else: the mine never reads it, and it is here so an estimate can be
            compared with what it estimated.
        sensors:
          type: array
          items: { type: string }
          description: The sensors that detected it, first arrival first. Each is one pick job.
        located_at_seconds:
          type: [number, "null"]
          description: When enough of its picks had been processed to locate it. Null until then.
        located:
          oneOf: [{ $ref: "#/components/schemas/Location" }, { type: "null" }]
          description: The first location, solved from the picks processed by then.
        processed_at_seconds:
          type: [number, "null"]
          description: When every one of its picks had been processed.
        final:
          oneOf: [{ $ref: "#/components/schemas/Location" }, { type: "null" }]
          description: The location solved from every pick. Null for an event too few sensors saw.
        picks_processed_at_seconds:
          type: [array, "null"]
          items: { type: [number, "null"] }
          description: |
            When each pick was processed, in the order of `sensors`; null for
            one still waiting. Null as a whole for an event recorded before this
            was tracked.

    Burst:
      type: object
      description: |
        A seismic event that floods the queue. This is the reason the system
        exists: ordinary monitoring is steady and easy to provision for, while
        a rock burst produces an hour of work in a minute and keeps producing
        aftershocks for hours.
      properties:
        at_seconds:
          type: number
          description: How far into the scenario the main event happens.
        magnitude:
          type: number
          description: How far above background the rate spikes at the instant of the event.
        aftershock_decay_seconds:
          type: number
          description: |
            The timescale of the Omori-law aftershock tail. Zero means the
            event subsides at once, which makes recovery far easier than it is
            in practice.
        epicentre:
          $ref: "#/components/schemas/Point"
          description: |
            Where in the rock it happens; its aftershocks cluster around it.
            Optional, and drawn from the seed when absent. Must lie inside the
            mine, or the scenario is refused when saved.
        main_magnitude:
          type: number
          description: |
            The Nuttli magnitude of the burst's main shock, its first event.
            Defaults to 2.5. Not the same as `magnitude`, which scales the
            event rate.
      required: [at_seconds, magnitude]

    Scenario:
      type: object
      properties:
        id: { type: string }
        mine_id: { type: string }
        name: { type: string }
        duration_seconds: { type: number }
        job_seconds:
          type: number
          description: How long one job occupies an executor, before per-job variation.
        pick_jitter_seconds:
          type: number
          minimum: 0
          description: |
            The standard deviation of pick error: how far a sensor's reported
            arrival is from the true one. It is the dial that sets how
            uncertain the mine's locations are, and turning it moves no event
            and no job.
        workforce:
          type: object
          description: |
            Who is underground. Omit for the default (8 people, 4 crewed and 3
            autonomous vehicles); a stated one of zeroes means nobody. Moves no
            event and no job.
          properties:
            people: { type: integer, minimum: 0 }
            crewed_vehicles: { type: integer, minimum: 0 }
            autonomous_vehicles: { type: integer, minimum: 0 }
        seed:
          type: integer
          format: int64
          description: |
            Two runs of one scenario replay exactly the same jobs, which is
            what makes comparing two autoscaler settings a controlled
            experiment rather than an anecdote. Generated if omitted.
        priority_mix:
          type: object
          additionalProperties: { type: number }
          description: Relative weights per priority level. They need not sum to anything.
          example: { "100": 1, "50": 1, "25": 2 }
        bursts:
          type: array
          items: { $ref: "#/components/schemas/Burst" }
        description: { type: string }
        created_at: { type: string, format: date-time }
      required: [mine_id, duration_seconds, job_seconds, priority_mix]

    RunRequest:
      type: object
      properties:
        name: { type: string }
        mode: { type: string, enum: [simulation, live] }
        scenario_id:
          type: string
          description: Required for a simulation run; there is nothing to replay without one.
        target_id:
          type: string
          description: |
            The autoscaler target for a live run. A simulation run leaves this
            empty and gets a target of its own.
        decision_interval_seconds:
          type: number
          default: 15
          description: Should match the target's own setting, or the run measures a different controller from the one deployed.
        time_compression:
          type: number
          default: 600
          description: |
            Simulated seconds per real second, so a run can be watched while it
            happens. Very large values mean "as fast as it will go".
        settings:
          type: object
          description: |
            The autoscaler settings this run is executed under. This is how one
            scenario is replayed under different policies — the comparison the
            whole application exists to make.
      required: [mode]

    Run:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        scenario_id: { type: string }
        target_id: { type: string }
        mode: { type: string, enum: [simulation, live] }
        status: { type: string, enum: [pending, running, completed, failed, cancelled] }
        simulated_start: { type: string, format: date-time }
        time_compression: { type: number }
        decision_interval_seconds:
          type: number
          description: |
            Seconds, like every other duration in this API. A response can be
            sent straight back as a request without conversion.
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        error: { type: string }
        created_at: { type: string, format: date-time }

    QueueSnapshot:
      type: object
      properties:
        depth: { type: integer }
        oldest_job_age_seconds: { type: number }
        arrival_rate_per_second: { type: number }

    Cycle:
      type: object
      description: |
        One decision, with everything needed to explain it later: what the
        queue looked like, what was running, what the autoscaler decided and
        why, and what actually happened in that interval.
      properties:
        run_id: { type: string }
        sequence: { type: integer }
        at: { type: string, format: date-time }
        queues:
          type: object
          description: The waiting work by the priority each job holds now, which is the order it will be served in.
          additionalProperties: { $ref: "#/components/schemas/QueueSnapshot" }
        depth_by_submitted_priority:
          type: [object, "null"]
          additionalProperties: { type: integer }
          description: |
            The same waiting work counted by the priority each job was
            submitted at. It differs from `queues` only once something has
            changed a priority after submission. Null for a cycle recorded
            before this was tracked, which is not the same as an empty queue.
        local_ready: { type: integer }
        cloud_ready: { type: integer }
        local_pending: { type: integer }
        cloud_pending: { type: integer }
        action: { type: string }
        plan_local: { type: integer }
        plan_cloud: { type: integer }
        reason: { type: string }
        constraint: { type: string }
        settings_version: { type: integer, format: int64 }
        breach_expected:
          type: boolean
          description: What the autoscaler predicted. Comparing it with `breached` is the point of a run.
        completed: { type: integer }
        breached: { type: integer }

    Metrics:
      type: object
      description: |
        Chosen so two runs of one scenario under different settings are
        directly comparable on the only two questions that matter: did it hold
        the SLA, and what did that cost.
      properties:
        run_id: { type: string }
        jobs_submitted: { type: integer }
        jobs_completed: { type: integer }
        sla_breaches: { type: integer }
        breach_rate: { type: number }
        mean_wait_seconds: { type: number }
        p95_wait_seconds: { type: number }
        max_wait_seconds: { type: number }
        peak_queue_depth: { type: integer }
        local_executor_seconds:
          type: number
          description: Charged on ready executors only; capacity that spent an interval starting up did no work.
        cloud_executor_seconds:
          type: number
          description: Kept separate because cloud is the tier that is actually billed.
        peak_local_executors: { type: integer }
        peak_cloud_executors: { type: integer }
        scaling_actions: { type: integer }
        cycles: { type: integer }
