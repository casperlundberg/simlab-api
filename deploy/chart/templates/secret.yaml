{{- if or (and (not .Values.database.existingSecret) (include "simlab-api.databaseURL" .)) (and (not .Values.autoscaler.existingSecret) .Values.autoscaler.token) (and (not .Values.auth.existingSecret) .Values.auth.token) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "simlab-api.secretName" . }}
  labels:
    {{- include "simlab-api.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if and (not .Values.database.existingSecret) (include "simlab-api.databaseURL" .) }}
  database-url: {{ include "simlab-api.databaseURL" . | quote }}
  {{- end }}
  {{- if and (not .Values.autoscaler.existingSecret) .Values.autoscaler.token }}
  # The credential this service presents to the autoscaler.
  api-token: {{ .Values.autoscaler.token | quote }}
  {{- end }}
  {{- if and (not .Values.auth.existingSecret) .Values.auth.token }}
  # The credential callers must present to this service. A different key, so
  # one Secret can hold both without either being mistaken for the other.
  simlab-api-token: {{ .Values.auth.token | quote }}
  {{- end }}
{{- end }}
