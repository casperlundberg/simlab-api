image:
  # Docker Hub, and the namespace is cappelumpa — that is the Docker Hub
  # account, not the GitHub user casperlundberg. The two have been confused
  # before.
  repository: docker.io/cappelumpa/simlab-api
  tag: ""
  pullPolicy: IfNotPresent

# One replica. Runs are held in memory by the process that started them, and a
# second replica would neither know about them nor be able to stop them — and
# a load balancer would send half the status requests to the wrong one.
replicaCount: 1

service:
  type: ClusterIP
  port: 8081

# The token guarding *this* service's API.
#
# Distinct from autoscaler.token below, which is the credential this service
# presents when calling the autoscaler. This one is what callers must present
# to it. They are different directions of a different relationship and should
# not be assumed to be the same string.
#
# It matters because this is the service that gets published: simlab-web's
# nginx proxies /api straight here. Left empty the API is open to anyone who
# can reach the ingress, and since this service holds the autoscaler's token,
# that reaches an authenticated autoscaler.
auth:
  # existingSecret holding a "simlab-api-token" key. Preferred anywhere real.
  existingSecret: ""
  token: ""

# The autoscaler this Simlab drives.
autoscaler:
  # url defaults to the autoscaler service in this same namespace, which is the
  # whole point of deploying them together.
  url: ""
  # existingSecret holding an "api-token" key, or a literal token for a
  # development install. The token unlocks every platform credential the
  # autoscaler holds, so an existingSecret is strongly preferred.
  existingSecret: ""
  token: ""

database:
  # existingSecret holding a "database-url" key. Preferred: a connection string
  # contains a password, and values.yaml ends up in a git history.
  existingSecret: ""
  url: ""

  # An in-namespace Postgres, for a self-contained install. Turn it off and
  # point database.url at a managed instance for anything long-lived.
  embedded:
    enabled: true
    image: postgres:16-alpine
    database: simlab
    user: simlab
    password: simlab
    storage: 8Gi
    # Explicit, always. Unset on a cluster with no default StorageClass, the
    # PVC stays Pending forever and nothing in the pod's events says why.
    storageClassName: ""

# A directory of built frontend assets, if this container also serves the SPA.
# Leave empty when simlab-web is deployed as its own pod.
staticDir: ""

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    memory: 1Gi

logLevel: info

podSecurityContext:
  runAsNonRoot: true
  # Numeric, and it has to be. The image's own USER is "nonroot:nonroot" — a
  # name — and the kubelet cannot prove a name is non-root, so with
  # runAsNonRoot set and no runAsUser it refuses the container outright:
  #
  #   container has runAsNonRoot and image has non-numeric user (nonroot),
  #   cannot verify user is non-root
  #
  # 65532 is the uid behind that name in gcr.io/distroless/static-debian12.
  # No fsGroup here: this pod mounts no volume. Add one with the volume.
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

nodeSelector: {}
tolerations: []
affinity: {}
