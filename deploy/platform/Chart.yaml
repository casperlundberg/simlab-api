apiVersion: v2
name: autoscale-platform
description: The whole platform in one namespace — autoscaler, Simlab backend, Simlab frontend, and a Postgres.
type: application
version: 0.1.0
appVersion: "0.1.0"

# The three services are separately deployable and live in separate
# repositories; this chart only composes them. The file:// paths expect all
# three checked out side by side, which is how the repositories are meant to be
# worked on. For an install from a registry, replace each repository with the
# OCI reference the charts are published to — nothing else changes.
dependencies:
  - name: autoscaler
    version: "0.1.0"
    repository: "file://../../../autoscaler/deploy/chart"
  - name: simlab-api
    version: "0.1.0"
    repository: "file://../chart"
  - name: simlab-web
    version: "0.1.0"
    repository: "file://../../../simlab-web/deploy/chart"
